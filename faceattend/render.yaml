services:
  # Redis Service
  - type: redis
    name: smart-attendance-redis
    plan: free
    ipAllowList: [] # Allow only internal services to connect

  # Backend API Service
  - type: web
    name: smart-attendance-backend
    runtime: python
    region: oregon
    plan: starter
    rootDir: server/backend-api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: ENVIRONMENT
        value: production
      - key: MONGO_URI
        sync: false # User will input their MongoDB Atlas URI in the UI
      - key: REDIS_URL
        fromService:
          type: redis
          name: smart-attendance-redis
          property: connectionString
      - key: ML_SERVICE_URL
        value: http://smart-attendance-ml:10000 # Internal Render networking URL
      - key: JWT_SECRET
        generateValue: true # Render will generate a secure random string
      - key: SESSION_SECRET_KEY
        generateValue: true # Render will generate a secure random string

  # ML Service
  - type: web
    name: smart-attendance-ml
    runtime: python
    region: oregon
    plan: starter
    rootDir: server/ml-service
    buildCommand: pip install -r requirements.txt && python download_models.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11

